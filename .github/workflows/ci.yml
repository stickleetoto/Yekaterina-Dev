name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install 'tiktoken>=0.7'
      # scipy, numpy and mpmath are the independent references the
      # statistical operations are checked against. They are not runtime
      # dependencies: the engine has none beyond its Rust crates.
      - run: pip install 'scipy>=1.11' 'numpy>=1.26' 'mpmath>=1.3' 'statsmodels>=0.14'

      # v1.3 preserves the promoted v1.2 registry/engine/audits as historical
      # artifacts, then verifies the aggregate 1,425-op surface separately.
      # The old v1.2 audit is intentionally not executed on a v1.3 tree because
      # it pins the v1.2 module wiring and 1,410-op release state by design.
      - run: python scripts/static_audit_v13.py
      - run: python scripts/lexical_rust_audit.py
      - run: python scripts/operation_manifest.py
      # These two retain the complete frozen v1.2 source/fixture coverage.
      - run: python scripts/validate_golden_manifest.py
      - run: python scripts/validate_full_audit.py

      # Cargo.lock is committed, so `--locked` validates the exact dependency
      # graph. v1.3 development keeps the crate package version at 1.2.0 until
      # release preparation so this registry migration does not require a lock
      # regeneration commit unrelated to the compute-surface change.
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked --release

      # Existing three-tool MCP demo must remain unchanged.
      - run: python tools/demo.py ./target/release/yekaterina
      # New v1.3 gate: all 15 promoted xfmr operations must be discoverable,
      # spec-readable and executable over the real MCP stdio process.
      - run: python scripts/verify_v13_transformer_runtime.py ./target/release/yekaterina

      # Frozen v1.2 reference/acceptance suite remains a regression layer.
      - run: python scripts/verify_v12_operations.py
      - run: python scripts/verify_statistics.py
      - run: python scripts/verify_multiplicity.py
      - run: python golden/run_golden.py --exe ./target/release/yekaterina --out ./golden_results/ci
      - run: python scripts/check_golden_result.py ./golden_results/ci/result.json
      - run: python full_audit/run_full_audit.py --exe ./target/release/yekaterina --out ./full_audit_results/ci --strict

      # Timing-independent benchmark invariants remain the same three-tool MCP
      # schema, deterministic responses, and bounded error envelopes.
      - run: python bench/run_bench.py --exe ./target/release/yekaterina --out ./bench_results/ci --runs 2 --cold-reps 3 --label "ci"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            golden_results/ci/
            full_audit_results/ci/
            bench_results/ci/
          if-no-files-found: ignore
