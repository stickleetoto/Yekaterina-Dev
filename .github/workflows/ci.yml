name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install 'tiktoken>=0.7'
      # scipy, numpy and mpmath are the independent references the
      # statistical operations are checked against. They are not runtime
      # dependencies: the engine has none beyond its Rust crates.
      - run: pip install 'scipy>=1.11' 'numpy>=1.26' 'mpmath>=1.3'

      # The v1.2 audit reproduces every v1.0.0 and v1.1 gate, and hash-verifies
      # that scripts/static_audit.py and scripts/static_audit_v11.py -- the
      # frozen audits of those lines -- have not been modified. Running either
      # of them here would be redundant and would fail by design: each pins its
      # own line's package version and operation count, and v1.2 changed both.
      - run: python scripts/static_audit_v12.py
      - run: python scripts/lexical_rust_audit.py
      - run: python scripts/operation_manifest.py
      - run: python scripts/validate_golden_manifest.py
      - run: python scripts/validate_full_audit.py

      # Cargo.lock is committed, so `--locked` must validate *it*. Regenerating
      # the lockfile first (as this workflow used to) made every later --locked
      # step check the freshly generated file instead, which defeated the
      # reproducibility guarantee the exact version pins exist to provide.
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked --release

      # 164 assertions comparing every v1.2 operation against a value computed
      # by a different route than the implementation uses.
      - run: python scripts/verify_v12_operations.py
      # 961 values checked against scipy, numpy and mpmath: the
      # incomplete gamma and beta at 50 digits, then every distribution,
      # test, interval and regression built on them.
      - run: python scripts/verify_statistics.py
      - run: python golden/run_golden.py --exe ./target/release/yekaterina --out ./golden_results/ci
      - run: python scripts/check_golden_result.py ./golden_results/ci/result.json
      - run: python full_audit/run_full_audit.py --exe ./target/release/yekaterina --out ./full_audit_results/ci --strict

      # Timing-independent half of the benchmark harness: the frozen MCP surface
      # (3 tools / 412 tokens / 1725 bytes), byte-identical responses across
      # runs, and no unexpected error envelopes. No --compare: wall-clock
      # comparison against a baseline captured on other hardware would be noise,
      # and performance decisions are made with bench/paired_ab.py locally.
      - run: python bench/run_bench.py --exe ./target/release/yekaterina --out ./bench_results/ci --runs 2 --cold-reps 3 --label "ci"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            golden_results/ci/
            full_audit_results/ci/
            bench_results/ci/
          if-no-files-found: ignore
