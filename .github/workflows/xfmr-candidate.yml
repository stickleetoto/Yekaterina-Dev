name: Transformer Candidate

on:
  pull_request:
    paths:
      - 'src/transformer_candidate.rs'
      - 'tests/transformer_candidate.rs'
      - 'docs/V13_CANDIDATE_EVALUATOR.md'
      - 'full_audit/opcodes_v13_transformer_candidate.json'
      - 'scripts/audit_v13_transformer_candidate.py'
      - '.github/workflows/xfmr-candidate.yml'
  push:
    branches:
      - v1.3-candidate-evaluator
    paths:
      - 'src/transformer_candidate.rs'
      - 'tests/transformer_candidate.rs'
      - 'docs/V13_CANDIDATE_EVALUATOR.md'
      - 'full_audit/opcodes_v13_transformer_candidate.json'
      - 'scripts/audit_v13_transformer_candidate.py'
      - '.github/workflows/xfmr-candidate.yml'

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Audit staged v1.3 native surface
        run: python scripts/audit_v13_transformer_candidate.py
      - name: Candidate evaluator tests
        run: cargo test --locked --test transformer_candidate
      - name: Clippy candidate evaluator test target
        run: cargo clippy --locked --test transformer_candidate
