[package]
name = "yekaterina"
version = "1.2.0"
edition = "2024"
description = "Token-efficient compute engine for LLMs over MCP"
license = "Apache-2.0"

[dependencies]
anyhow = "=1.0.104"
bigdecimal = "=0.4.10"
libm = "=0.2.16"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
rmcp = { version = "=3.2.0", features = ["server", "transport-io"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
pretty_assertions = "=1.4.1"

[profile.release]
# Phase 2D. `panic` stays at the default "unwind": the Phase 5 worker pool must
# contain a panicking job rather than aborting the whole process.
lto = "fat"
codegen-units = 1

# Harness-free so the exact-pinned, audited dependency set gains nothing.
[[bench]]
name = "micro"
harness = false
